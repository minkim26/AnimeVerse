name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-verse-backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: animeverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/animeverse
      ISSUER_BASE_URL: https://test.auth0.local/
      AUDIENCE: https://test-audience
      AUTH0_TEST_SIGNING_SECRET: ci-test-signing-secret-not-for-production-use-0000
      # Space after the comma is deliberate: exercises cors.test.ts's check
      # that app.ts trims each origin rather than matching it literally.
      FRONTEND_URL: "http://localhost:5173, http://localhost:5174"
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost
      SUPABASE_URL: https://fake.supabase.co
      SUPABASE_KEY: fake-key
      PORT: 8000
      ADMIN_CRON_SECRET: ci-test-admin-cron-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anime-verse-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run initdb
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: animeverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/animeverse
      ISSUER_BASE_URL: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
      AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      E2E_AUTH0_TEST_EMAIL: ${{ secrets.E2E_AUTH0_TEST_EMAIL }}
      E2E_AUTH0_TEST_PASSWORD: ${{ secrets.E2E_AUTH0_TEST_PASSWORD }}
      # Must match the port Playwright boots the frontend dev server on
      # (playwright.config.ts webServer) — server.ts's cors() rejects
      # any other origin.
      FRONTEND_URL: http://localhost:5174
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost
      SUPABASE_URL: https://fake.supabase.co
      SUPABASE_KEY: fake-key
      PORT: 8000
      ADMIN_CRON_SECRET: ci-test-admin-cron-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            anime-verse-backend/package-lock.json

      - name: Install and start backend
        working-directory: anime-verse-backend
        run: |
          npm ci
          npm run initdb
          npm start > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health || { echo "backend never became healthy"; cat /tmp/backend.log; exit 1; }

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
