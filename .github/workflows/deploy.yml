name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  deployments: write
  checks: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: '${{ github.token }}'
          environment: production
          environment-url: https://api.minkim26.tech

      # The backend runs on a home-lab LXC with no public IP, so the runner
      # joins the Tailscale network before it can reach it at all.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/animeverse
            git pull
            cd anime-verse-backend
            docker compose -f compose.prod.yml up -d --build

      - name: Mark deployment successful
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          state: success
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          environment-url: https://api.minkim26.tech

      - name: Mark deployment failed
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          state: failure
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      # The frontend deploys separately, through Cloudflare's own GitHub
      # integration (not this workflow), which reports as the "Workers
      # Builds: animeverse" check run on this commit rather than through the
      # Deployments API. Independent of the backend deploy above, so this
      # runs regardless of whether that succeeded or failed - poll that
      # check run for its real conclusion instead of assuming success just
      # because this workflow is running.
      - name: Track frontend deployment (Cloudflare Workers)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          REPO="${{ github.repository }}"

          DEPLOYMENT_ID=$(gh api "repos/$REPO/deployments" \
            -f ref="$SHA" \
            -f environment=production-frontend \
            -f description="Cloudflare Workers frontend" \
            -F auto_merge=false \
            --jq .id)

          CONCLUSION=""
          for i in $(seq 1 30); do
            RUN=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "Workers Builds: animeverse")')
            STATUS=$(echo "$RUN" | jq -r '.status // empty')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // empty')
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            sleep 10
          done

          if [ "$CONCLUSION" = "success" ]; then
            STATE=success
          else
            STATE=failure
          fi

          gh api "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$STATE" \
            -f environment_url="https://animeverse.minkim26.tech"
