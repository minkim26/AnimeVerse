name: Update E2E Snapshots

# Manual trigger only. Regenerates the Playwright visual-regression
# baselines on the same Ubuntu runner image CI uses, then opens a PR
# with the diff — replaces pulling the Playwright Docker image locally
# to produce Linux-platform baselines by hand.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:update

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Update Linux Playwright visual-regression baselines
          title: Update Linux Playwright visual-regression baselines
          body: >
            Auto-generated by the "Update E2E Snapshots" workflow
            (workflow_dispatch), run on the same Ubuntu runner image the
            `e2e` CI job uses.
          branch: update-e2e-snapshots
          delete-branch: true
          add-paths: e2e/visual.spec.ts-snapshots/**
