<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeVerse - Discover Anime Recommendations</title>
    <meta
      name="description"
      content="AnimeVerse recommends anime tailored to your taste — swipe through a discovery deck, then get personalized picks powered by taste-vector matching."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnimeVerse" />
    <meta property="og:title" content="AnimeVerse - Discover Anime Recommendations" />
    <meta
      property="og:description"
      content="AnimeVerse recommends anime tailored to your taste — swipe through a discovery deck, then get personalized picks powered by taste-vector matching."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"AnimeVerse","url":"%VITE_SITE_URL%/"}
    </script>
    <!--
      No production host is configured yet (see CLAUDE.md), so this meta tag
      is the only place a CSP can live right now. A meta tag can't set
      frame-ancestors, Strict-Transport-Security, X-Frame-Options, or
      Permissions-Policy — those need to be added as real response headers
      once a host exists (see anime-verse-backend/app.ts for the ones
      already set on the API's own responses).

      style-src needs 'unsafe-inline': Vite injects <style> tags at runtime
      in both dev and build (confirmed against Vite's docs), and a static
      SPA with no per-request server templating can't generate the nonces
      that would let script/style-src drop it. Strict nonce-based style-src
      is the upgrade path once real server-side templating exists.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https://graphql.anilist.co %VITE_API_URL%; object-src 'none'; frame-src 'none'; base-uri 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
